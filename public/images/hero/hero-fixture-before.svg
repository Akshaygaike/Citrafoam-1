<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background studio vignette -->
    <radialGradient id="studioBgBefore" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="60%" stop-color="#1A202C" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>

    <!-- Dull, oxidized matte faucet gradient -->
    <linearGradient id="dullMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="35%" stop-color="#64748B" />
      <stop offset="60%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Chalky calcium scale texture pattern -->
    <filter id="chalkFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="1 0 0 0 0.9  0 1 0 0 0.92  0 0 1 0 0.94  0 0 0 0.45 0" in="noise" result="coloredNoise" />
      <feComposite in="coloredNoise" in2="SourceGraphic" operator="in" />
    </filter>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="800" height="600" fill="url(#studioBgBefore)" />

  <!-- Marble Countertop (Matte / stained with hardwater) -->
  <path d="M0,480 L800,480 L800,600 L0,600 Z" fill="#1E293B" />
  <line x1="0" y1="480" x2="800" y2="480" stroke="#334155" stroke-width="2" />

  <!-- Crusty water stains on base counter -->
  <ellipse cx="400" cy="510" rx="90" ry="24" fill="#64748B" opacity="0.3" />
  <ellipse cx="400" cy="508" rx="80" ry="18" fill="#CBD5E1" opacity="0.25" />
  <ellipse cx="420" cy="515" rx="40" ry="10" fill="#E2E8F0" opacity="0.2" />

  <!-- Faucet Shadow -->
  <ellipse cx="410" cy="505" rx="70" ry="14" fill="#090D16" opacity="0.7" />

  <!-- Faucet Group -->
  <g>
    <!-- Faucet Base Collar -->
    <path d="M360,500 L440,500 L435,470 L365,470 Z" fill="url(#dullMetal)" />
    <!-- Crusty limescale collar ring -->
    <path d="M358,502 C360,492 440,492 442,502 L440,497 C438,490 362,490 360,497 Z" fill="#E2E8F0" opacity="0.7" />

    <!-- Vertical Stem Body -->
    <rect x="375" y="320" width="50" height="150" fill="url(#dullMetal)" />

    <!-- Handle Socket & Lever (Tarnished) -->
    <path d="M425,410 L470,410 L470,430 L425,430 Z" fill="url(#dullMetal)" />
    <path d="M465,415 L510,380 L516,386 L470,422 Z" fill="#475569" />
    <circle cx="513" cy="383" r="6" fill="#334155" />

    <!-- Curved Gooseneck Spout -->
    <!-- Outer curve path -->
    <path d="M375,320 C375,180 340,130 260,130 C190,130 180,200 180,270 L220,270 C220,220 225,170 260,170 C305,170 335,210 335,320 Z" fill="url(#dullMetal)" />

    <!-- Aerator Tip (Heavy mineral encrustation) -->
    <rect x="175" y="270" width="50" height="24" rx="3" fill="#334155" />
    <rect x="180" y="294" width="40" height="12" rx="2" fill="#475569" />

    <!-- Chalky Limescale Encrustation around Aerator -->
    <path d="M172,285 Q176,305 186,308 Q195,302 205,307 Q215,303 228,306 L226,282 Z" fill="#E2E8F0" opacity="0.8" />
    <circle cx="185" cy="298" r="4" fill="#F8FAFC" opacity="0.9" />
    <circle cx="200" cy="302" r="5" fill="#F1F5F9" opacity="0.9" />
    <circle cx="215" cy="297" r="4" fill="#E2E8F0" opacity="0.85" />
    <circle cx="192" cy="292" r="3.5" fill="#CBD5E1" opacity="0.9" />

    <!-- Mineral Buildup on Gooseneck Curve (Water drips & calcium stains) -->
    <!-- Drip spots -->
    <ellipse cx="230" cy="155" rx="14" ry="7" fill="#CBD5E1" opacity="0.6" transform="rotate(-15 230 155)" />
    <ellipse cx="280" cy="150" rx="20" ry="9" fill="#E2E8F0" opacity="0.55" transform="rotate(10 280 150)" />
    <ellipse cx="320" cy="180" rx="16" ry="8" fill="#CBD5E1" opacity="0.6" transform="rotate(40 320 180)" />
    <ellipse cx="350" cy="230" rx="12" ry="16" fill="#E2E8F0" opacity="0.5" />
    <ellipse cx="355" cy="290" rx="10" ry="24" fill="#CBD5E1" opacity="0.45" />

    <!-- Vertical Stem Water Marks -->
    <ellipse cx="388" cy="360" rx="6" ry="18" fill="#E2E8F0" opacity="0.5" />
    <ellipse cx="405" cy="390" rx="8" ry="25" fill="#CBD5E1" opacity="0.45" />
    <ellipse cx="390" cy="430" rx="7" ry="15" fill="#E2E8F0" opacity="0.55" />
    <circle cx="415" cy="350" r="5" fill="#F8FAFC" opacity="0.6" />
    <circle cx="395" cy="450" r="4" fill="#F1F5F9" opacity="0.7" />
    <circle cx="382" cy="385" r="4.5" fill="#E2E8F0" opacity="0.5" />

    <!-- Rough Calcium Texture Overlay across whole faucet -->
    <path d="M375,320 C375,180 340,130 260,130 C190,130 180,200 180,270 L220,270 C220,220 225,170 260,170 C305,170 335,210 335,320 Z" fill="#94A3B8" opacity="0.18" filter="url(#chalkFilter)" />
    <rect x="375" y="320" width="50" height="150" fill="#94A3B8" opacity="0.2" filter="url(#chalkFilter)" />
  </g>

  <!-- Water Spot Splatters on Backdrop -->
  <circle cx="270" cy="350" r="3" fill="#64748B" opacity="0.4" />
  <circle cx="290" cy="380" r="2" fill="#64748B" opacity="0.3" />
  <circle cx="470" cy="310" r="2.5" fill="#64748B" opacity="0.4" />
</svg>
