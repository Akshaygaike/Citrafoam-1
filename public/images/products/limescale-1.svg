<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4FBF7"/>
      <stop offset="100%" stop-color="#E1F3E9"/>
    </linearGradient>
    <linearGradient id="bottleBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FBFBFD"/>
      <stop offset="85%" stop-color="#EAEAEF"/>
      <stop offset="100%" stop-color="#DCDCE2"/>
    </linearGradient>
    <linearGradient id="triggerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1DB954"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="nozzleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D1D1F"/>
      <stop offset="100%" stop-color="#3A3A3C"/>
    </linearGradient>
    <filter id="bottleShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F2E1E" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad)" rx="24"/>

  <!-- Bottle Silhouette Group -->
  <g filter="url(#bottleShadow)" transform="translate(110, 60)">
    <!-- Trigger Spray Head -->
    <path d="M70,40 L110,40 C118,40 125,45 128,52 L140,80 C143,87 138,95 130,95 L95,95 L95,120 L65,120 L65,95 L40,95 C35,95 30,90 30,85 L35,60 C37,48 52,40 70,40 Z" fill="url(#triggerGrad)"/>
    
    <!-- Nozzle / Spray Tip -->
    <rect x="135" y="70" width="16" height="18" rx="3" fill="url(#nozzleGrad)"/>
    <circle cx="150" cy="79" r="3" fill="#10B981"/>

    <!-- Ergonomic Trigger Lever -->
    <path d="M85,95 C92,105 100,120 95,135 C92,142 85,145 80,140 C75,135 80,115 78,95 Z" fill="#15803D"/>

    <!-- Neck Collar / Ribbing -->
    <rect x="68" y="118" width="44" height="14" rx="2" fill="#E5E7EB"/>
    <line x1="72" y1="122" x2="108" y2="122" stroke="#9CA3AF" stroke-width="1.5"/>
    <line x1="72" y1="126" x2="108" y2="126" stroke="#9CA3AF" stroke-width="1.5"/>

    <!-- Main Bottle Body -->
    <path d="M70,132 C50,145 42,165 42,195 L42,340 C42,355 52,365 70,365 L110,365 C128,365 138,355 138,340 L138,195 C138,165 130,145 110,132 Z" fill="url(#bottleBody)"/>
    
    <!-- Glossy Highlight on bottle shoulder -->
    <path d="M50,195 C50,170 56,152 70,142 L72,148 C60,158 55,172 55,195 L55,335 C55,342 52,345 50,345 Z" fill="#FFFFFF" opacity="0.6"/>

    <!-- Label Container -->
    <rect x="52" y="185" width="76" height="140" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>

    <!-- Label Content -->
    <!-- Brand Name -->
    <text x="90" y="205" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="11" font-weight="800" fill="#1D1D1F" text-anchor="middle" letter-spacing="1.5">CITRAFOAM</text>
    
    <!-- Accent Line -->
    <line x1="68" y1="212" x2="112" y2="212" stroke="#10B981" stroke-width="1.5"/>
    
    <!-- Product Name -->
    <text x="90" y="226" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="8.5" font-weight="700" fill="#15803D" text-anchor="middle">HEAVY-DUTY</text>
    <text x="90" y="237" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="8" font-weight="600" fill="#1D1D1F" text-anchor="middle">LIMESCALE</text>
    <text x="90" y="247" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="7.5" font-weight="500" fill="#4B5563" text-anchor="middle">ELIMINATOR</text>

    <!-- Lab Spec Icon -->
    <circle cx="90" cy="265" r="10" fill="#F0FDF4" stroke="#10B981" stroke-width="0.75"/>
    <text x="90" y="268" font-size="8" fill="#15803D" text-anchor="middle">⚡</text>

    <!-- Formula tags -->
    <text x="90" y="287" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="5.5" font-weight="600" fill="#6B7280" text-anchor="middle">ACTIVE CITRIC MICRO-FOAM</text>
    <text x="90" y="297" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="5" fill="#9CA3AF" text-anchor="middle">CLINGS • DISSOLVES • SHINES</text>
    
    <!-- Volume Badge -->
    <rect x="74" y="306" width="32" height="10" rx="3" fill="#F3F4F6"/>
    <text x="90" y="313" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="5.5" font-weight="700" fill="#374151" text-anchor="middle">500 ML</text>
  </g>

  <!-- Micro-Foam Bubbles Floating -->
  <circle cx="95" cy="140" r="7" fill="#FFFFFF" opacity="0.8" stroke="#10B981" stroke-width="0.75"/>
  <circle cx="108" cy="125" r="4" fill="#FFFFFF" opacity="0.9" stroke="#10B981" stroke-width="0.75"/>
  <circle cx="285" cy="170" r="9" fill="#FFFFFF" opacity="0.8" stroke="#10B981" stroke-width="0.75"/>
  <circle cx="295" cy="155" r="5" fill="#FFFFFF" opacity="0.9" stroke="#10B981" stroke-width="0.75"/>
  <circle cx="275" cy="190" r="4" fill="#FFFFFF" opacity="0.7" stroke="#10B981" stroke-width="0.75"/>
</svg>
