<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Before side: cloudy, chalky calcium scale -->
    <linearGradient id="chalkyScale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- After side: Brilliant specular mirror chrome -->
    <linearGradient id="pureChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="25%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="#0F172A"/>

  <!-- Left: Crusty limescale and hardwater calcification on shower glass & faucet -->
  <g>
    <!-- Darkened tile / shower backdrop -->
    <rect x="0" y="0" width="400" height="450" fill="#1E293B"/>
    
    <!-- Heavy calcified water spots -->
    <ellipse cx="200" cy="225" rx="160" ry="140" fill="url(#chalkyScale)"/>
    <ellipse cx="140" cy="180" rx="45" ry="30" fill="#E2E8F0" opacity="0.35"/>
    <ellipse cx="260" cy="280" rx="60" ry="40" fill="#CBD5E1" opacity="0.4"/>
    <ellipse cx="180" cy="300" rx="35" ry="25" fill="#E2E8F0" opacity="0.3"/>
    <circle cx="210" cy="140" r="18" fill="#F1F5F9" opacity="0.45"/>
    <circle cx="270" cy="190" r="24" fill="#E2E8F0" opacity="0.4"/>
    <circle cx="110" cy="260" r="28" fill="#CBD5E1" opacity="0.3"/>
    <circle cx="150" cy="110" r="15" fill="#F1F5F9" opacity="0.35"/>

    <text x="50" y="60" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#EF4444" letter-spacing="1">BEFORE CITRAFOAM</text>
    <text x="50" y="85" font-family="-apple-system, sans-serif" font-size="12" fill="#94A3B8">3 Years of Untreated Calcium Carbonate Buildup</text>
  </g>

  <!-- Right: Restored to showroom luster -->
  <g transform="translate(400, 0)">
    <rect x="0" y="0" width="400" height="450" fill="#020617"/>
    
    <!-- Mirror Gleam Faucet / Surface -->
    <ellipse cx="200" cy="225" rx="160" ry="140" fill="url(#pureChrome)"/>

    <!-- Light reflection bar -->
    <polygon points="140,50 180,50 260,400 220,400" fill="#FFFFFF" opacity="0.5"/>

    <!-- Brilliant Starburst Flares -->
    <g transform="translate(240, 160)">
      <polygon points="0,-24 5,-5 24,0 5,5 0,24 -5,5 -24,0 -5,-5" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="5" fill="#38BDF8"/>
    </g>
    <g transform="translate(150, 270)">
      <polygon points="0,-18 4,-4 18,0 4,4 0,18 -4,4 -18,0 -4,-4" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="3.5" fill="#10B981"/>
    </g>

    <text x="50" y="60" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#10B981" letter-spacing="1">AFTER CITRAFOAM</text>
    <text x="50" y="85" font-family="-apple-system, sans-serif" font-size="12" fill="#6EE7B7">100% Streak-Free Luster • Invisible Repel Shield</text>
  </g>

  <!-- Center guideline indicator -->
  <line x1="400" y1="0" x2="400" y2="450" stroke="#FFFFFF" stroke-width="2"/>
</svg>
