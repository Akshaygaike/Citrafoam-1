<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="kitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>
    <linearGradient id="cooktopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3F3F46"/>
      <stop offset="50%" stop-color="#52525B"/>
      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="70%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" rx="24" fill="url(#kitBg)"/>

  <!-- Induction / Gas Burner Cooktop -->
  <g transform="translate(60, 120)">
    <rect x="0" y="0" width="280" height="200" rx="16" fill="url(#cooktopGrad)" stroke="#71717A" stroke-width="1.5"/>
    <circle cx="140" cy="100" r="70" fill="#18181B" stroke="#A1A1AA" stroke-width="2"/>
    <circle cx="140" cy="100" r="45" fill="#27272A" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="140" cy="100" r="22" fill="#18181B"/>

    <!-- Active Citrus Foam Lifting Grease Splatter -->
    <!-- Grease Splatters (fading) -->
    <ellipse cx="90" cy="65" rx="18" ry="8" fill="#78350F" opacity="0.3"/>
    <ellipse cx="180" cy="140" rx="22" ry="10" fill="#78350F" opacity="0.25"/>

    <!-- Foam Clusters encapsulating grease -->
    <circle cx="85" cy="62" r="14" fill="#FFFFFF" opacity="0.9" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="98" cy="68" r="10" fill="#FFFBEB" opacity="0.95" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="75" cy="72" r="8" fill="#FFFFFF" opacity="0.9"/>
    
    <circle cx="185" cy="138" r="16" fill="#FFFFFF" opacity="0.9" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="170" cy="145" r="11" fill="#FFFBEB" opacity="0.95" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="198" cy="142" r="9" fill="#FFFFFF" opacity="0.9"/>

    <!-- Sparkling Clean Zone -->
    <polygon points="140,50 143,58 151,61 143,64 140,72 137,64 129,61 137,58" fill="#FFFFFF"/>
    <polygon points="210,90 212,95 217,97 212,99 210,104 208,99 203,97 208,95" fill="#FDE68A"/>
  </g>

  <!-- Technical Spec Box -->
  <g transform="translate(50, 360)">
    <rect width="300" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#F59E0B" stroke-width="1"/>
    <text x="150" y="26" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#F59E0B" text-anchor="middle">LIPOLYTIC CITRUS MATRIX</text>
    <text x="150" y="44" font-family="-apple-system, sans-serif" font-size="9" fill="#E4E4E7" text-anchor="middle">Enzyme bio-catalysts encapsulate polymerized cooking oils</text>
    <text x="150" y="60" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#FDE68A" text-anchor="middle">Zero residue • Safe on stainless steel &amp; granite</text>
  </g>
</svg>
