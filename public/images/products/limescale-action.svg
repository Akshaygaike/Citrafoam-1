<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="actionBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="chromeTap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="30%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="foamBurst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" rx="24" fill="url(#actionBg)"/>

  <!-- Chrome Faucet Graphic -->
  <path d="M120,380 L120,220 C120,160 160,120 220,120 L270,120 C280,120 290,130 290,140 L290,200 C290,205 285,210 280,210 L260,210 C255,210 250,205 250,200 L250,155 C250,145 240,138 230,138 L215,138 C175,138 145,170 145,210 L145,380 Z" fill="url(#chromeTap)"/>

  <!-- Micro-Foam Clinging Layer -->
  <g opacity="0.95">
    <ellipse cx="250" cy="210" rx="35" ry="18" fill="#F0FDF4" stroke="#34D399" stroke-width="2"/>
    <ellipse cx="270" cy="218" rx="20" ry="12" fill="#FFFFFF" stroke="#34D399" stroke-width="1.5"/>
    <ellipse cx="230" cy="215" rx="18" ry="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>

    <!-- Foaming bubbles clinging to pipe -->
    <circle cx="210" cy="140" r="14" fill="#FFFFFF" stroke="#34D399" stroke-width="1.5"/>
    <circle cx="230" cy="145" r="9" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="190" cy="150" r="11" fill="#FFFFFF" stroke="#34D399" stroke-width="1.5"/>
    <circle cx="160" cy="180" r="15" fill="#FFFFFF" stroke="#34D399" stroke-width="1.5"/>
    <circle cx="140" cy="220" r="13" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="145" cy="250" r="12" fill="#FFFFFF" stroke="#34D399" stroke-width="1.5"/>
    <circle cx="142" cy="280" r="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  </g>

  <!-- Exploded Reaction Graphic -->
  <g transform="translate(40, 60)">
    <rect width="130" height="60" rx="10" fill="#FFFFFF" fill-opacity="0.1" stroke="#34D399" stroke-width="1" backdrop-filter="blur(10px)"/>
    <text x="15" y="24" font-family="-apple-system, Inter, sans-serif" font-size="10" font-weight="700" fill="#34D399">ACTIVE CHELATION</text>
    <text x="15" y="38" font-family="-apple-system, Inter, sans-serif" font-size="8" fill="#94A3B8">CaCO₃ + Citric Acid</text>
    <text x="15" y="50" font-family="-apple-system, Inter, sans-serif" font-size="8" font-weight="600" fill="#FFFFFF">→ Soluble Calcium Citrate</text>
  </g>

  <!-- Gleam / Star effect on chrome -->
  <g transform="translate(138, 320)">
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="3" fill="#34D399"/>
  </g>
  <g transform="translate(260, 130)">
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="4" fill="#38BDF8"/>
  </g>

  <text x="200" y="450" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">10-MINUTE VERTICAL CLING FORMULA</text>
</svg>
