<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <!-- Stand-up Pouch Eco Refill 1L Variant -->
  <defs>
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="30%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F3F4F6"/>
      <stop offset="100%" stop-color="#D1D5DB"/>
    </linearGradient>
    <filter id="pouchShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F2E1E" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="500" rx="24" fill="#F4FBF7"/>

  <!-- Standup Pouch -->
  <g filter="url(#pouchShadow)" transform="translate(100, 70)">
    <!-- Spout Cap -->
    <rect x="85" y="20" width="30" height="24" rx="4" fill="#15803D"/>
    <rect x="90" y="8" width="20" height="14" rx="2" fill="#1D1D1F"/>

    <!-- Pouch Body -->
    <path d="M70,44 L130,44 C150,55 170,90 175,200 L185,320 C185,335 170,345 150,345 L50,345 C30,345 15,335 15,320 L25,200 C30,90 50,55 70,44 Z" fill="url(#pouchGrad)"/>

    <!-- Label -->
    <rect x="40" y="110" width="120" height="180" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
    <text x="100" y="140" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#1D1D1F" text-anchor="middle" letter-spacing="1.5">CITRAFOAM</text>
    <line x1="70" y1="148" x2="130" y2="148" stroke="#10B981" stroke-width="1.5"/>

    <text x="100" y="168" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">1L ECO REFILL</text>
    <text x="100" y="184" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#1D1D1F" text-anchor="middle">LIMESCALE ELIMINATOR</text>

    <text x="100" y="215" font-family="-apple-system, sans-serif" font-size="6.5" font-weight="600" fill="#4B5563" text-anchor="middle">REFILLS 2x SPRAY BOTTLES</text>
    <text x="100" y="230" font-family="-apple-system, sans-serif" font-size="6" fill="#9CA3AF" text-anchor="middle">REDUCES 78% PLASTIC</text>

    <rect x="80" y="250" width="40" height="14" rx="4" fill="#ECFDF5"/>
    <text x="100" y="260" font-family="-apple-system, sans-serif" font-size="7" font-weight="bold" fill="#059669" text-anchor="middle">1000 ML</text>
  </g>
</svg>
