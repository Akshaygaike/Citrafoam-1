<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <!-- Macro exploded view of precision aeration nozzle -->
  <rect width="400" height="500" rx="24" fill="#0B1320"/>

  <g transform="translate(80, 100)">
    <circle cx="120" cy="120" r="100" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <circle cx="120" cy="120" r="75" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
    <circle cx="120" cy="120" r="40" fill="#1E293B"/>

    <!-- Mesh Filter Aerator Grid -->
    <line x1="85" y1="120" x2="155" y2="120" stroke="#34D399" stroke-width="1.5"/>
    <line x1="120" y1="85" x2="120" y2="155" stroke="#34D399" stroke-width="1.5"/>
    <line x1="95" y1="95" x2="145" y2="145" stroke="#34D399" stroke-width="1.5"/>
    <line x1="95" y1="145" x2="145" y2="95" stroke="#34D399" stroke-width="1.5"/>

    <circle cx="120" cy="120" r="12" fill="#10B981"/>
  </g>

  <!-- Exploded callouts -->
  <text x="200" y="360" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">PRECISION AERATION NOZZLE</text>
  <text x="200" y="385" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94A3B8" text-anchor="middle">Mixes 1 part citric solution with 4 parts atmospheric air</text>
  <text x="200" y="405" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#34D399" text-anchor="middle">Creates 0.3mm micro-bubbles that cling to vertical tile &amp; glass</text>
</svg>
