<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <!-- Refill Kit Box Open Layout with 3 Glass Vials / Pods -->
  <rect width="400" height="500" rx="24" fill="#F0FDF4"/>

  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="280" height="280" rx="20" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="2"/>
    <text x="140" y="38" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#1D1D1F" text-anchor="middle" letter-spacing="1">ZERO-WASTE REFILL TRIO</text>

    <!-- 3 Pod Compartments -->
    <rect x="25" y="60" width="65" height="150" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
    <rect x="107" y="60" width="65" height="150" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
    <rect x="190" y="60" width="65" height="150" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>

    <!-- Pod 1 -->
    <rect x="42" y="85" width="30" height="70" rx="15" fill="#34D399"/>
    <text x="57" y="180" font-family="sans-serif" font-size="7" font-weight="bold" fill="#047857" text-anchor="middle">Limescale</text>
    <text x="57" y="195" font-family="sans-serif" font-size="6" fill="#059669" text-anchor="middle">500ml Yield</text>

    <!-- Pod 2 -->
    <rect x="124" y="85" width="30" height="70" rx="15" fill="#FBBF24"/>
    <text x="139" y="180" font-family="sans-serif" font-size="7" font-weight="bold" fill="#B45309" text-anchor="middle">Degreaser</text>
    <text x="139" y="195" font-family="sans-serif" font-size="6" fill="#D97706" text-anchor="middle">500ml Yield</text>

    <!-- Pod 3 -->
    <rect x="207" y="85" width="30" height="70" rx="15" fill="#60A5FA"/>
    <text x="222" y="180" font-family="sans-serif" font-size="7" font-weight="bold" fill="#1D4ED8" text-anchor="middle">All-Purpose</text>
    <text x="222" y="195" font-family="sans-serif" font-size="6" fill="#2563EB" text-anchor="middle">500ml Yield</text>

    <!-- Instructions tag -->
    <rect x="30" y="230" width="220" height="28" rx="8" fill="#F3F4F6"/>
    <text x="140" y="248" font-family="-apple-system, sans-serif" font-size="8" font-weight="600" fill="#374151" text-anchor="middle">Add Pod → Fill Water → Shake 10s</text>
  </g>

  <text x="200" y="420" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#047857" text-anchor="middle">Compatible with all Citrafoam trigger sprayers</text>
</svg>
